<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文 5 字母聽說讀寫全方位評量遊戲平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 100%);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .canvas-container {
      position: relative;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.2);
    }
    #gameCanvas {
      display: block;
      background: #ffffff;
      touch-action: none;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-5 text-slate-800">

  <header class="w-full max-w-5xl flex items-center justify-between mb-2 px-2 text-white">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🌟</span>
      <div>
        <h1 class="text-lg md:text-2xl font-black tracking-wide drop-shadow">英文 5 字母聽說讀寫評量館</h1>
        <p class="text-xs md:text-sm text-blue-200 font-medium">針對國中資源班設計：聽音、口說、大小寫與手寫全方位評量</p>
      </div>
    </div>
    <div class="flex items-center gap-2 md:gap-3">
      <div class="bg-white/20 backdrop-blur-md px-3 py-1.5 md:py-2 rounded-2xl flex items-center gap-1.5 border border-white/30 shadow-inner">
        <span class="text-cyan-300 font-bold text-xs md:text-sm">本題得分：<span id="roundScoreText" class="text-cyan-300 font-black">+0</span></span>
      </div>
      <div class="bg-white/20 backdrop-blur-md px-3 md:px-4 py-1.5 md:py-2 rounded-2xl flex items-center gap-1.5 border border-white/30 shadow-inner">
        <span class="text-amber-300 text-base md:text-lg">⭐</span>
        <span class="text-white font-bold text-xs md:text-base">累計總分：<span id="scoreText" class="text-amber-300 font-black">0</span></span>
      </div>
    </div>
  </header>

  <main class="w-full max-w-5xl flex flex-col items-center">
    <div class="canvas-container w-full bg-white relative">
      <canvas id="gameCanvas"></canvas>
    </div>
  </main>

  <footer class="mt-2 text-center text-blue-200 text-xs">
    💡 教學指引：每輪 10 題評量，僅首次作答採計分數；口說支援麥克風與教師手動判定，書寫支援手指與觸控筆。
  </footer>

  <script>
    const VIRTUAL_WIDTH = 940;
    const VIRTUAL_HEIGHT = 650;

    // 5 個核心評量字母題庫（擴充口說辨識諧音別名庫）
    const quizData = [
      { 
        letter: "A", lowercase: "a", phonics: "æ", word: "Apple", icon: "🍎",
        spokenAliases: ["a", "ay", "apple", "ei", "hey", "8", "eight", "eh", "ah", "欸", "诶", "阿"],
        missingPart: { desc: "缺少中間一橫", hintType: "crossbar" } 
      },
      { 
        letter: "B", lowercase: "b", phonics: "b", word: "Ball", icon: "⚽",
        spokenAliases: ["b", "bee", "ball", "be", "beat", "boy", "book", "逼", "比", "波"],
        missingPart: { desc: "缺少下方的圓肚肚", hintType: "bottomLoop" } 
      },
      { 
        letter: "C", lowercase: "c", phonics: "k", word: "Cat", icon: "🐱",
        spokenAliases: ["c", "see", "sea", "cat", "si", "say", "car", "cup", "吸", "西", "顆"],
        missingPart: { desc: "缺了右上弧線", hintType: "topCurve" } 
      },
      { 
        letter: "D", lowercase: "d", phonics: "d", word: "Dog", icon: "🐶",
        spokenAliases: ["d", "dee", "dog", "di", "day", "door", "duck", "低", "第", "的"],
        missingPart: { desc: "缺了右側大半圓", hintType: "rightArc" } 
      },
      { 
        letter: "E", lowercase: "e", phonics: "e", word: "Egg", icon: "🥚",
        spokenAliases: ["e", "egg", "ee", "yi", "eat", "elephant", "依", "一", "誒"],
        missingPart: { desc: "缺少中間的橫線", hintType: "midBar" } 
      }
    ];

    // 四大核心能力模組
    let currentSkill = 'listening'; // 'listening' | 'speaking' | 'reading' | 'writing'
    let currentGameIndex = 0;       // 0, 1, 2
    let score = 0;
    let lastEarnedScore = 0;
    let currentTarget = quizData[0];
    let clickTargets = [];
    let messageToast = null;
    let particles = [];
    let animationFrameId = null;

    // 10 題回合評量管理
    const MAX_ROUNDS = 10;
    let currentRound = 1;
    let correctCount = 0;
    let isGameOver = false;
    let hasAnsweredCurrentRound = false;

    // 聽力小遊戲專屬狀態變數
    let balloons = [];
    let phonicsRevealed = false;
    let phonicsUserSelected = null;
    let cartDrops = [];
    const cartWidth = 130;
    const cartHeight = 45;
    let cartX = VIRTUAL_WIDTH / 2 - cartWidth / 2;
    let dropSpawnTimer = 0;

    // 閱讀小遊戲專屬狀態變數
    let memoryCards = [];
    let flippedCards = [];
    let memoryLock = false;
    let matchedPairsCount = 0;
    let spaceMeteors = [];
    let meteorTimer = 0;
    let meteorTargetIsUpper = true;

    // 口說小遊戲專屬狀態變數
    let isListeningSpeech = false;
    let speechTranscript = "點擊下方麥克風，大聲唸出！";
    let speechRecognition = null;
    let speechPassed = false;
    let speechSuccessTimer = null;
    let raceCarProgress = 0; // 0 ~ 100%
    let speechMode = 'recognition';
    let audioStream = null;
    let audioAnalyser = null;
    let micVolumeLevel = 0; // 0 ~ 100
    let volumeTriggerTimer = 0;
    const isFileProtocol = (window.location.protocol === 'file:');

    // 書寫小遊戲專屬狀態變數（畫布筆跡）
    let drawnStrokes = []; // 筆劃紀錄 [{color, width, points: [{x, y}]}]
    let isDrawing = false;
    let showGuideTemplate = true;
    let revealBlindAnswer = false;
    let currentColor = '#2563eb';
    let writingTargetIsUpper = true;
    const writeArea = { x: 270, y: 195, w: 400, h: 290 };

    // 離線字形比對畫布 (用以演算法比對筆劃重疊度)
    const hitCanvas = document.createElement('canvas');
    hitCanvas.width = writeArea.w;
    hitCanvas.height = writeArea.h;
    const hitCtx = hitCanvas.getContext('2d');

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreText');
    const roundScoreDisplay = document.getElementById('roundScoreText');

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(type) {
      try {
        const aCtx = getAudioContext();
        if (!aCtx) return;
        const now = aCtx.currentTime;

        if (type === 'click') {
          const osc = aCtx.createOscillator();
          const gain = aCtx.createGain();
          osc.connect(gain);
          gain.connect(aCtx.destination);
          osc.frequency.setValueAtTime(450, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'correct') {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = aCtx.createOscillator();
            const gain = aCtx.createGain();
            osc.connect(gain);
            gain.connect(aCtx.destination);
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = aCtx.createOscillator();
          const gain = aCtx.createGain();
          osc.connect(gain);
          gain.connect(aCtx.destination);
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.setValueAtTime(195, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = aCtx.createOscillator();
            const gain = aCtx.createGain();
            osc.connect(gain);
            gain.connect(aCtx.destination);
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.15, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.35);
          });
        }
      } catch (err) {
        console.warn('Audio play issue:', err);
      }
    }

    function speak(text, rate = 0.82) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

    // 初始化麥克風音量感應（免依賴 Google 伺服器的離線/資源班備援神器）
    async function initVolumeSensing() {
      try {
        if (!audioStream) {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        const aCtx = getAudioContext();
        if (!aCtx) return;
        const source = aCtx.createMediaStreamSource(audioStream);
        audioAnalyser = aCtx.createAnalyser();
        audioAnalyser.fftSize = 256;
        source.connect(audioAnalyser);
        monitorVolume();
      } catch (err) {
        console.warn('Volume sensing mic access issue:', err);
      }
    }

    function monitorVolume() {
      if (!audioAnalyser || !isListeningSpeech || speechPassed) {
        micVolumeLevel = 0;
        return;
      }
      const buffer = new Uint8Array(audioAnalyser.frequencyBinCount);
      audioAnalyser.getByteFrequencyData(buffer);
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) sum += buffer[i];
      const avg = sum / buffer.length;
      micVolumeLevel = Math.min(100, Math.round((avg / 128) * 100));

      // 若在發音感應模式或作為辨識備援：音量超過 22 即視為學生有大聲發音
      if (micVolumeLevel > 22) {
        volumeTriggerTimer++;
        if (volumeTriggerTimer >= 6) { // 持續發音約 0.15 秒即判定成功
          triggerSpeechSuccess(`檢測到大聲發音！(音量 ${micVolumeLevel}%)`);
          volumeTriggerTimer = 0;
          return;
        }
      } else {
        volumeTriggerTimer = Math.max(0, volumeTriggerTimer - 1);
      }

      if (isListeningSpeech && !speechPassed) {
        requestAnimationFrame(monitorVolume);
      }
    }

    // 初始化語音辨識（全新增強型）
    function createSpeechRecognitionInstance() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 5;

      recognition.onstart = () => {
        isListeningSpeech = true;
        speechTranscript = "🎙️ 正在聆聽中... 請大聲唸出！";
        initVolumeSensing();
      };

      recognition.onresult = (event) => {
        if (speechPassed) return;
        let latestWords = [];
        for (let i = event.resultIndex; i < event.results.length; i++) {
          for (let j = 0; j < event.results[i].length; j++) {
            const candidate = event.results[i][j].transcript.trim().toLowerCase();
            if (candidate) {
              latestWords.push(candidate);
              if (verifySpokenText(candidate)) {
                triggerSpeechSuccess(`辨識成功：「${candidate.toUpperCase()}」✓`);
                return;
              }
            }
          }
        }
        if (latestWords.length > 0) {
          speechTranscript = `聽到：「${latestWords[0]}」... 請再唸一次！`;
        }
      };

      recognition.onerror = (event) => {
        console.warn('SpeechRecognition error:', event.error);
        if (event.error === 'not-allowed') {
          speechTranscript = "⚠️ 麥克風未授權，已自動切換大聲感應！";
        } else if (event.error === 'network') {
          speechTranscript = "⚠️ 雲端語音受限，已自動切換大聲感應！";
        }
      };

      recognition.onend = () => {
        if (isListeningSpeech && !speechPassed) {
          try { recognition.start(); } catch (_) {}
        }
      };

      return recognition;
    }

    function verifySpokenText(spoken) {
      if (!spoken) return false;
      const s = spoken.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
      const targetLetter = currentTarget.letter.toLowerCase();
      const targetWord = currentTarget.word.toLowerCase();
      
      // 精確比對或包含目標字母/單字
      if (s === targetLetter || s.startsWith(targetLetter)) return true;
      if (s.includes(targetWord)) return true;
      if (currentTarget.spokenAliases && currentTarget.spokenAliases.some(alias => s.includes(alias.toLowerCase()))) {
        return true;
      }
      return false;
    }

    function triggerSpeechSuccess(msg) {
      if (speechPassed) return;
      speechPassed = true;
      speechTranscript = msg || "🎉 辨識成功！太棒了！";
      stopListening();

      // 即時推進賽車或得分
      if (currentSkill === 'speaking' && currentGameIndex === 2) {
        raceCarProgress = Math.min(100, raceCarProgress + 25);
      }

      processAnswer(true);

      // 1.5 秒後自動前往下一題，給予流暢無卡頓的過關體驗
      if (speechSuccessTimer) clearTimeout(speechSuccessTimer);
      speechSuccessTimer = setTimeout(() => {
        advanceRound();
      }, 1500);
    }

    function toggleListening() {
      if (speechPassed) return;
      if (isListeningSpeech) {
        stopListening();
        speechTranscript = "⏸️ 已暫停收音，點擊再次開始！";
        return;
      }

      isListeningSpeech = true;
      volumeTriggerTimer = 0;
      speechTranscript = "🎙️ 正在聆聽中... 請大聲唸出！";
      initVolumeSensing();

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          if (speechRecognition) {
            try { speechRecognition.abort(); } catch (_) {}
          }
          speechRecognition = createSpeechRecognitionInstance();
          speechRecognition.start();
        } catch (e) {
          console.warn('Fallback to volume sensing:', e);
        }
      }
    }

    function stopListening() {
      isListeningSpeech = false;
      if (speechRecognition) {
        try { speechRecognition.abort(); } catch (_) {}
      }
    }

    function stopSpeechRecognitionIfActive() {
      stopListening();
      if (speechSuccessTimer) {
        clearTimeout(speechSuccessTimer);
        speechSuccessTimer = null;
      }
    }

    function resizeCanvas() {
      const container = canvas.parentElement;
      if (!container) return;
      const containerWidth = container.clientWidth;
      const aspect = VIRTUAL_HEIGHT / VIRTUAL_WIDTH;
      const displayWidth = containerWidth;
      const displayHeight = containerWidth * aspect;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = VIRTUAL_WIDTH * dpr;
      canvas.height = VIRTUAL_HEIGHT * dpr;
      canvas.style.width = `${displayWidth}px`;
      canvas.style.height = `${displayHeight}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);

    function updateScoreUI(earned = null) {
      if (earned !== null) {
        lastEarnedScore = earned;
        roundScoreDisplay.innerText = (earned >= 0 ? `+${earned}` : `${earned}`);
      }
      scoreDisplay.innerText = score;
    }

    function startNewGameSession() {
      stopSpeechRecognitionIfActive();
      score = 0;
      currentRound = 1;
      correctCount = 0;
      isGameOver = false;
      hasAnsweredCurrentRound = false;
      raceCarProgress = 0;
      updateScoreUI(0);
      pickNewTarget();
    }

    function pickNewTarget() {
      stopSpeechRecognitionIfActive();
      const randomIndex = Math.floor(Math.random() * quizData.length);
      currentTarget = quizData[randomIndex];
      phonicsRevealed = false;
      phonicsUserSelected = null;
      hasAnsweredCurrentRound = false;
      speechPassed = false;
      speechTranscript = "點擊下方麥克風，大聲唸出！";
      drawnStrokes = [];
      revealBlindAnswer = false;
      showGuideTemplate = (currentGameIndex === 0);
      meteorTargetIsUpper = Math.random() < 0.5;
      writingTargetIsUpper = Math.random() < 0.5;
      initGameSpecificElements();
    }

    function initGameSpecificElements() {
      if (currentSkill === 'listening' && currentGameIndex === 0) {
        balloons = quizData.map((item, i) => ({
          letter: item.letter,
          x: 110 + i * 175,
          baseY: 420,
          floatOffset: Math.random() * Math.PI * 2,
          radiusX: 54,
          radiusY: 68,
          color: ['#f43f5e', '#06b6d4', '#8b5cf6', '#10b981', '#f59e0b'][i % 5]
        }));
      }

      if (currentSkill === 'listening' && currentGameIndex === 2) {
        cartDrops = [];
        dropSpawnTimer = 0;
        cartX = VIRTUAL_WIDTH / 2 - cartWidth / 2;
        spawnCartDrop();
      }

      if (currentSkill === 'reading' && currentGameIndex === 0) {
        initMemoryGame();
      }

      if (currentSkill === 'reading' && currentGameIndex === 2) {
        spaceMeteors = [];
        meteorTimer = 0;
        spawnMeteor();
      }
    }

    function initMemoryGame() {
      let cards = [];
      quizData.forEach((q, idx) => {
        cards.push({ id: idx * 2, pairId: idx, char: q.letter, isUpper: true, isFlipped: false, isMatched: false });
        cards.push({ id: idx * 2 + 1, pairId: idx, char: q.lowercase, isUpper: false, isFlipped: false, isMatched: false });
      });
      cards.sort(() => Math.random() - 0.5);
      memoryCards = cards;
      flippedCards = [];
      memoryLock = false;
      matchedPairsCount = 0;
    }

    function spawnCartDrop() {
      const isTarget = Math.random() < 0.45;
      const dropItem = isTarget ? currentTarget : quizData[Math.floor(Math.random() * quizData.length)];
      cartDrops.push({
        letter: dropItem.letter,
        x: 130 + Math.random() * (VIRTUAL_WIDTH - 260),
        y: 270,
        vy: 1.5 + Math.random() * 0.8,
        radius: 36,
        color: ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 5)]
      });
    }

    function spawnMeteor() {
      const isTarget = Math.random() < 0.5;
      const item = isTarget ? currentTarget : quizData[Math.floor(Math.random() * quizData.length)];
      const displayChar = meteorTargetIsUpper ? item.letter : item.lowercase;
      spaceMeteors.push({
        letter: displayChar,
        x: 120 + Math.random() * (VIRTUAL_WIDTH - 240),
        y: 270,
        vy: 1.3 + Math.random() * 0.7,
        radius: 36,
        color: ['#0284c7', '#7c3aed', '#db2777', '#059669', '#d97706'][Math.floor(Math.random() * 5)]
      });
    }

    function draw() {
      ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
      clickTargets = [];

      drawNavigation();

      if (isGameOver) {
        drawAssessmentReport();
      } else {
        drawRoundBadge();

        if (currentSkill === 'listening') {
          if (currentGameIndex === 0) drawListeningGame1();
          else if (currentGameIndex === 1) drawListeningGame2();
          else if (currentGameIndex === 2) drawListeningGame3();
        } else if (currentSkill === 'speaking') {
          if (currentGameIndex === 0) drawSpeakingGame1();
          else if (currentGameIndex === 1) drawSpeakingGame2();
          else if (currentGameIndex === 2) drawSpeakingGame3();
        } else if (currentSkill === 'reading') {
          if (currentGameIndex === 0) drawReadingGame1();
          else if (currentGameIndex === 1) drawReadingGame2();
          else if (currentGameIndex === 2) drawReadingGame3();
        } else if (currentSkill === 'writing') {
          if (currentGameIndex === 0) drawWritingGame1();
          else if (currentGameIndex === 1) drawWritingGame2();
          else if (currentGameIndex === 2) drawWritingGame3();
        }
      }

      updateAndDrawParticles();
      drawFeedbackToast();

      animationFrameId = requestAnimationFrame(draw);
    }

    function drawNavigation() {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, VIRTUAL_WIDTH, 132);

      const skillButtons = [
        { id: 'listening', label: '🎧 聽力評量', color: '#3b82f6' },
        { id: 'speaking',  label: '🗣️ 口說評量', color: '#f59e0b' },
        { id: 'reading',   label: '📖 閱讀評量', color: '#8b5cf6' },
        { id: 'writing',   label: '✍️ 書寫評量', color: '#10b981' }
      ];

      skillButtons.forEach((sb, i) => {
        const x = 35 + i * 220;
        drawPillButton(x, 15, 205, 46, sb.label, currentSkill === sb.id, sb.color, () => {
          playTone('click');
          currentSkill = sb.id;
          currentGameIndex = 0;
          startNewGameSession();
        });
      });

      let subGames = [];
      if (currentSkill === 'listening') {
        subGames = ['① 氣球聽音戳戳樂', '② 音素聽音辨字', '③ 字母採購車'];
      } else if (currentSkill === 'speaking') {
        subGames = ['① 魔法麥克風', '② Phonics 大挑戰', '③ 聲控賽車衝衝衝'];

    function handleMemoryCardClick(card) {
      if (memoryLock || card.isFlipped || card.isMatched) return;

      playTone('click');
      card.isFlipped = true;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        memoryLock = true;
        const [c1, c2] = flippedCards;

        if (c1.pairId === c2.pairId && c1.id !== c2.id) {
          // 配對成功
          setTimeout(() => {
            c1.isMatched = true;
            c2.isMatched = true;
            flippedCards = [];
            memoryLock = false;
            matchedPairsCount++;
            score += 20;
            updateScoreUI(20);
            playTone('correct');
            createConfettiParticles();
            showFeedbackToast(`🎉 太棒了！大小寫成對 (${c1.char} & ${c2.char}) +20分！`, true);

            if (matchedPairsCount >= 5) {
              setTimeout(() => {
                isGameOver = true;
                playTone('fanfare');
              }, 1000);
            }
          }, 450);
        } else {
          // 配對失敗：翻回
          setTimeout(() => {
            c1.isFlipped = false;
            c2.isFlipped = false;
            flippedCards = [];
            memoryLock = false;
            playTone('wrong');
            updateScoreUI(0);
          }, 850);
        }
      }
    }

      ctx.stroke();

      // 英文作業本標準四線三格：
      // 第 1 線（頂線）：灰色實線
      // 第 2 線（中線）：天藍色虛線
      // 第 3 線（底線/基準線）：鮮紅色實線
      // 第 4 線（下伸線）：灰色實線
      const padY = 42;
      const usableHeight = h - padY * 2;
      const gap = usableHeight / 3;

      for (let i = 0; i < 4; i++) {
        const ly = y + padY + i * gap;
        ctx.beginPath();
        ctx.moveTo(x + 16, ly);
        ctx.lineTo(x + w - 16, ly);

        if (i === 0 || i === 3) {
          ctx.strokeStyle = '#94a3b8'; // 灰邊線
          ctx.lineWidth = 1.5;
          ctx.setLineDash([]);
        } else if (i === 1) {
          ctx.strokeStyle = '#38bdf8'; // 中間虛線（天空藍）
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
        } else if (i === 2) {
          ctx.strokeStyle = '#ef4444'; // 紅色基準線（標準四線格基線）
          ctx.lineWidth = 2.5;
          ctx.setLineDash([]);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

      ctx.save();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = writeArea.x + writeArea.w / 2;
      const cy = writeArea.y + writeArea.h / 2;

      if (currentTarget.letter === 'A') {
        ctx.beginPath();
        ctx.moveTo(cx - 55, cy + 90);
        ctx.lineTo(cx, cy - 85);
        ctx.lineTo(cx + 55, cy + 90);
        ctx.stroke();
      } else if (currentTarget.letter === 'B') {
        ctx.beginPath();
        ctx.moveTo(cx - 45, cy + 90);
        ctx.lineTo(cx - 45, cy - 85);
        ctx.lineTo(cx + 10, cy - 85);
        ctx.arc(cx + 10, cy - 40, 45, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(cx - 45, cy + 5);
        ctx.stroke();
      } else if (currentTarget.letter === 'C') {
        ctx.beginPath();
        ctx.arc(cx, cy, 75, Math.PI * 0.4, Math.PI * 1.5);
        ctx.stroke();
      } else if (currentTarget.letter === 'D') {
        ctx.beginPath();
        ctx.moveTo(cx - 35, cy + 90);
        ctx.lineTo(cx - 35, cy - 85);
        ctx.stroke();
      } else if (currentTarget.letter === 'E') {
        ctx.beginPath();
        ctx.moveTo(cx + 45, cy - 85);
        ctx.lineTo(cx - 45, cy - 85);
        ctx.lineTo(cx - 45, cy + 90);
        ctx.lineTo(cx + 45, cy + 90);
        ctx.stroke();

      if (revealBlindAnswer) {

      drawQuestionFooterControls(() => speak(currentTarget.letter));
    }

    // 重新校準的高精度字形辨識演算法（針對大小寫與資源班運筆特徵優化）
    function verifyWritingAccuracy(targetChar, isUpper) {
      hitCtx.clearRect(0, 0, writeArea.w, writeArea.h);
      hitCtx.fillStyle = '#000000';

      const fontSize = isUpper ? 200 : (['b','d'].includes(targetChar) ? 180 : 150);
      const yOffset = isUpper ? 15 : (['a','c','e'].includes(targetChar) ? 35 : 10);
      hitCtx.font = `bold ${fontSize}px "Fredoka", sans-serif`;
      hitCtx.textAlign = 'center';
      hitCtx.textBaseline = 'middle';
      hitCtx.fillText(targetChar, writeArea.w / 2, writeArea.h / 2 + yOffset);

      const targetImgData = hitCtx.getImageData(0, 0, writeArea.w, writeArea.h).data;

      // 1. 提取目標字母有效骨架像素集合 (每 8px 採樣一個骨架點，檢測覆蓋度)
      let targetSkeletonPoints = [];
      for (let y = 0; y < writeArea.h; y += 8) {
        for (let x = 0; x < writeArea.w; x += 8) {
          const idx = (y * writeArea.w + x) * 4;
          if (targetImgData[idx + 3] > 100) {
            targetSkeletonPoints.push({ x, y });
          }
        }
      }

      // 2. 收集學生筆劃的所有點
      let userStrokePoints = [];
      drawnStrokes.forEach(s => {
        for (let i = 0; i < s.points.length; i++) {
          const pt = s.points[i];
          const localX = Math.round(pt.x - writeArea.x);
          const localY = Math.round(pt.y - writeArea.y);
          if (localX >= 0 && localX < writeArea.w && localY >= 0 && localY < writeArea.h) {
            userStrokePoints.push({ x: localX, y: localY });
          }
        }
      });

      // 筆劃點過少（如只點一下或劃短線）直接判定未完成
      if (userStrokePoints.length < 18) {
        showFeedbackToast('💡 筆劃太短或尚未書寫完成喔！', false);
        return { passed: false };
      }

      // 3. 檢測學生筆劃的「命中率（Hit Rate）」與「離道率（Out Rate）」
      // 給予半徑 22px 的寬容度（體諒資源班學生的肌肉控制）
      let hitPointsCount = 0;
      let outPointsCount = 0;

      userStrokePoints.forEach(p => {
        let isHit = false;
        for (let dx = -22; dx <= 22; dx += 7) {
          for (let dy = -22; dy <= 22; dy += 7) {
            const nx = p.x + dx;
            const ny = p.y + dy;
            if (nx >= 0 && nx < writeArea.w && ny >= 0 && ny < writeArea.h) {
              const idx = (ny * writeArea.w + nx) * 4;
              if (targetImgData[idx + 3] > 60) {
                isHit = true;
                break;
              }
            }
          }
          if (isHit) break;
        }

        if (isHit) hitPointsCount++;
        else outPointsCount++;
      });

      // 4. 檢測目標骨架被筆劃覆蓋的程度（防止只畫部分直線就給分）
      let coveredSkeletonCount = 0;
      targetSkeletonPoints.forEach(sp => {
        const isCovered = userStrokePoints.some(up => {
          const distSq = (up.x - sp.x) ** 2 + (up.y - sp.y) ** 2;
          return distSq <= (26 * 26);
        });
        if (isCovered) coveredSkeletonCount++;
      });

      const userTotal = userStrokePoints.length;
      const hitRatio = hitPointsCount / userTotal;           // 筆跡貼合字形比例
      const outRatio = outPointsCount / userTotal;           // 隨意塗鴉離道比例
      const skeletonCoverage = coveredSkeletonCount / targetSkeletonPoints.length; // 字母完整度

      // 判定標準：
      // 1. 筆跡必須有 60% 以上落在字形允許範圍內
      // 2. 出界塗鴉亂畫比例低於 40%
      // 3. 字形骨架覆蓋率必須達到 48% 以上（確保整個字母都有寫完整）
      const passed = (hitRatio >= 0.60 && outRatio <= 0.40 && skeletonCoverage >= 0.48);

      if (!passed) {
        if (skeletonCoverage < 0.48) {
          showFeedbackToast('💡 字母筆劃尚未寫完整喔，請再補齊！', false);
        } else if (outRatio > 0.40) {
          showFeedbackToast('💡 出界或塗鴉較多，清除後再試一次！', false);
        } else {
          showFeedbackToast('💡 字形形狀不太對喔，再對照一下！', false);
        }
      }

      return { passed };
    }

    // 缺筆補完演算法 (驗證補筆區域)
    function verifyMissingPartAccuracy(targetLetter) {
      const cx = writeArea.w / 2;
      const cy = writeArea.h / 2;
      let strokePoints = [];

      drawnStrokes.forEach(s => {
        for (let i = 0; i < s.points.length; i++) {
          const pt = s.points[i];
          strokePoints.push({ x: pt.x - writeArea.x, y: pt.y - writeArea.y });
        }
      });

      if (strokePoints.length < 8) {
        showFeedbackToast('💡 筆劃太短，請在缺筆處補上！', false);
        return { passed: false };
      }

      // 各字母補劃的核心關鍵區域 (Bounding Box)
      let hitTargetRegion = false;
      if (targetLetter === 'A') {
        // A 缺中間橫線: 應在中央 y 約 cy-5 ~ cy+45, x 約 cx-50 ~ cx+50
        hitTargetRegion = strokePoints.some(p => p.y >= cy - 10 && p.y <= cy + 45 && Math.abs(p.x - cx) <= 50);
      } else if (targetLetter === 'B') {
        // B 缺下肚: 應在右下圓弧 x > cx-20, y > cy+5
        hitTargetRegion = strokePoints.some(p => p.x >= cx - 20 && p.y >= cy + 5);
      } else if (targetLetter === 'C') {
        // C 缺右上弧: 應在右上區域 x > cx, y < cy
        hitTargetRegion = strokePoints.some(p => p.x >= cx && p.y <= cy + 10);
      } else if (targetLetter === 'D') {
        // D 缺右半圓: 應在右側弧線 x > cx-15
        hitTargetRegion = strokePoints.some(p => p.x >= cx - 15 && Math.abs(p.y - cy) <= 85);
      } else if (targetLetter === 'E') {
        // E 缺中間橫線: 應在中心水平區域
        hitTargetRegion = strokePoints.some(p => Math.abs(p.y - cy) <= 30 && p.x >= cx - 45);
      }

      if (!hitTargetRegion) {
        showFeedbackToast('💡 補筆位置不正確喔，請仔細觀察缺少哪一筆！', false);
      }

      return { passed: hitTargetRegion };
    }

    function renderUserStrokes() {
      ctx.save();
      drawnStrokes.forEach(stroke => {
        if (stroke.points.length < 2) return;
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      });
      ctx.restore();
    }

    function processAnswer(isCorrect, isSkipped = false) {
      if (!hasAnsweredCurrentRound) {
        hasAnsweredCurrentRound = true;
        if (isCorrect && !isSkipped) {
          score += 10;
          correctCount++;
          updateScoreUI(10);
          playTone('correct');
          createConfettiParticles();
          showFeedbackToast('🎉 太棒了！首次答對 (+10分)', true);
        } else {
          updateScoreUI(0);
          playTone('wrong');
          showFeedbackToast('💡 首次答錯 (+0分)！可點擊重聽並按「下一題」', false);
        }
      } else {
        if (isCorrect) {
          playTone('correct');
          showFeedbackToast('✓ 練習答對！(非首次作答不計分)', true);
        } else {
          playTone('wrong');
          showFeedbackToast('💡 答錯囉！請點擊「前往下一題」繼續！', false);
        }
      }
    }

    function advanceRound() {
      if (currentRound < MAX_ROUNDS) {
        currentRound++;
        pickNewTarget();
      } else {
        isGameOver = true;
        playTone('fanfare');
      }
    }

    function drawAssessmentReport() {
      const boxW = 640;
      const boxH = 450;
      const boxX = (VIRTUAL_WIDTH - boxW) / 2;
      const boxY = 145;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 28);
      ctx.fill();

      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, 80, [28, 28, 0, 0]);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏆 10 題全方位評量成績單', boxX + boxW / 2, boxY + 48);

      let stars = '⭐';
      let evaluation = '很棒的嘗試！再多練習會更熟悉喔！';
      if (correctCount >= 8) {
        stars = '⭐⭐⭐';
        evaluation = '太厲害了！發音與字形精熟達人！';
      } else if (correctCount >= 5) {
        stars = '⭐⭐';
        evaluation = '表現優異！多讀多寫會更得心應手！';
      }

      ctx.font = '40px "Fredoka", sans-serif';
      ctx.fillText(stars, boxX + boxW / 2, boxY + 140);

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
      ctx.fillText(`最終評量總分：${score} 分 (滿分 100 分)`, boxX + boxW / 2, boxY + 195);

      ctx.font = '600 18px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(`首次答對題數：${correctCount} / ${MAX_ROUNDS} 題 (準確率 ${(correctCount / MAX_ROUNDS * 100).toFixed(0)}%)`, boxX + boxW / 2, boxY + 235);

      ctx.font = 'bold 18px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#059669';
      ctx.fillText(evaluation, boxX + boxW / 2, boxY + 280);
      ctx.restore();

      drawButton(boxX + 65, boxY + 345, 230, 52, '🔄 再次挑戰 10 題', '#3b82f6', () => {
        startNewGameSession();
      });

      drawButton(boxX + 345, boxY + 345, 230, 52, '➔ 挑戰下一個評量', '#10b981', () => {
        currentGameIndex = (currentGameIndex + 1) % 3;
        startNewGameSession();
      });
    }

    function showFeedbackToast(msg, isSuccess) {
      messageToast = {
        text: msg,
        isSuccess: isSuccess,
        expireTime: Date.now() + 1500
      };
    }

    function drawFeedbackToast() {
      if (!messageToast) return;
      const remaining = messageToast.expireTime - Date.now();
      if (remaining <= 0) {
        messageToast = null;
        return;
      }
      const alpha = Math.min(1, remaining / 300);

      ctx.save();
      ctx.globalAlpha = alpha;
      const toastW = 440;
      const toastH = 64;
      const toastX = (VIRTUAL_WIDTH - toastW) / 2;
      const toastY = 145;

      ctx.fillStyle = messageToast.isSuccess ? '#10b981' : '#f59e0b';
      ctx.beginPath();
      ctx.roundRect(toastX, toastY, toastW, toastH, 32);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(messageToast.text, toastX + toastW / 2, toastY + toastH / 2);
      ctx.restore();
    }

    function createConfettiParticles() {
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: VIRTUAL_WIDTH / 2,
          y: 280,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          color: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'][Math.floor(Math.random() * 5)],
          size: Math.random() * 8 + 6,
          life: 1.0
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.45;
        p.life -= 0.02;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = VIRTUAL_WIDTH / rect.width;
      const scaleY = VIRTUAL_HEIGHT / rect.height;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handlePointerDown(e) {
      const pos = getCanvasCoordinates(e);

      // 書寫區域塗鴉偵測
      if (currentSkill === 'writing') {
        if (pos.x >= writeArea.x && pos.x <= writeArea.x + writeArea.w &&
            pos.y >= writeArea.y && pos.y <= writeArea.y + writeArea.h) {
          isDrawing = true;
          drawnStrokes.push({
            color: currentColor,
            width: 8,
            points: [{ x: pos.x, y: pos.y }]
          });
          return;
        }
      }

      // 聽力採購車拖曳
      if (currentSkill === 'listening' && currentGameIndex === 2 && pos.y >= 470) {
        cartX = Math.max(50, Math.min(VIRTUAL_WIDTH - cartWidth - 50, pos.x - cartWidth / 2));
      }

      // 一般按鈕點擊觸發
      for (let i = clickTargets.length - 1; i >= 0; i--) {
        const t = clickTargets[i];
        if (pos.x >= t.x && pos.x <= t.x + t.w && pos.y >= t.y && pos.y <= t.y + t.h) {
          t.action();
          break;
        }
      }
    }

    function handlePointerMove(e) {
      const pos = getCanvasCoordinates(e);

      if (currentSkill === 'writing' && isDrawing) {
        if (pos.x >= writeArea.x && pos.x <= writeArea.x + writeArea.w &&
            pos.y >= writeArea.y && pos.y <= writeArea.y + writeArea.h) {
          const currentStroke = drawnStrokes[drawnStrokes.length - 1];
          if (currentStroke) {
            currentStroke.points.push({ x: pos.x, y: pos.y });
          }
        }
      }

      if (currentSkill === 'listening' && currentGameIndex === 2 && pos.y >= 460) {
        cartX = Math.max(50, Math.min(VIRTUAL_WIDTH - cartWidth - 50, pos.x - cartWidth / 2));
      }
    }

    function handlePointerUp() {
      isDrawing = false;
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointerDown(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointerMove(e);
    }, { passive: false });

    window.addEventListener('touchend', handlePointerUp);

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      startNewGameSession();
      draw();
    });
  </script>
</body>
