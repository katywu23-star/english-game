<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>英文遊戲</title>
</head>
<body>
    <!-- 建立一個畫布，讓 ctx 有地方可以繪圖 -->
    <canvas id="myCanvas" width="800" height="400"></canvas>

    <script>
        // 設定 Canvas 繪圖環境
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // 把您原本的 drawFourLineGrid 函數貼在這裡
        function drawFourLineGrid(x, y, width, height, textToDraw, isGuide = false) {
            const lineSpacing = height / 3;
            const line1 = y;
            const line2 = y + lineSpacing;
            const line3 = y + lineSpacing * 2;
            const line4 = y + height;

            ctx.save();
            ctx.lineWidth = 2;

            ctx.strokeStyle = '#2c3e50';
            ctx.beginPath(); ctx.moveTo(x, line1); ctx.lineTo(x + width, line1); ctx.stroke();

            ctx.strokeStyle = '#3498db';
            ctx.setLineDash([8, 6]);
            ctx.beginPath(); ctx.moveTo(x, line2); ctx.lineTo(x + width, line2); ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, line3); ctx.lineTo(x + width, line3); ctx.stroke();

            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x, line4); ctx.lineTo(x + width, line4); ctx.stroke();

            if (textToDraw) {
                const isUpper = (textToDraw === textToDraw.toUpperCase() && textToDraw.match(/[A-Z]/));
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetical';

                if (isGuide) {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.25)';
                    ctx.font = 'bold 110px "Comic Sans MS", "Fredoka", sans-serif';
                } else {
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.45)';
                    ctx.font = 'bold 110px "Comic Sans MS", "Fredoka", sans-serif';
                }
                ctx.fillText(textToDraw, x + width / 2, line3);
            }
            ctx.restore();
        }

        // 呼叫函數測試畫面 (X座標, Y座標, 寬度, 高度, 字母)
        drawFourLineGrid(50, 50, 400, 150, "Apple");
    </script>
</body>
</html>
